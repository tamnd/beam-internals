# Every gate a pull request has to pass. The jobs are split by what a failure
# means, not by what is convenient to run together, so the job name tells you
# who has to fix it. Prose failures belong to the author, tools failures belong
# to whoever changed a checker.
#
# Actions are pinned to a commit rather than a tag. A tag can be moved, a commit
# cannot, and this repository runs on a schedule against a token that can open
# issues. Dependabot bumps the pins and the comment next to each one says which
# release the SHA is.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  prose:
    name: prose, ledger, blueprints, citations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: House style
        run: python -m tools.lintprose

      - name: Claim ledger
        run: python -m tools.ledger

      - name: Blueprint structure
        run: python -m tools.bplint

      - name: Citations resolve and match the pin
        run: python -m tools.refcheck

      # The half of the baker that needs no Erlang. Every elixir cell is
      # accounted for in its meta.toml, every deterministic cell has a
      # recording, and the output printed inside a lesson is the recording
      # rather than something that used to be true.
      - name: Lesson cells and their recordings line up
        run: python -m tools.bake --offline

  citations-deep:
    name: citations against the pinned OTP tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The submodule is the whole Erlang/OTP tree at the pinned tag, so this is
      # the slow job. It is shallow and it only ever needs one commit, which
      # takes it from several minutes down to under one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: The submodule is at the commit the pin names
        run: |
          pinned=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('refcheck.toml').read_text())['pin']['commit'])")
          actual=$(git -C otp rev-parse HEAD)
          if [ "$pinned" != "$actual" ]; then
            echo "refcheck.toml says $pinned, the submodule is at $actual"
            exit 1
          fi
          echo "Both agree on $pinned"

      - name: Every path and line number exists at the pin
        run: python -m tools.refcheck --strict

      # A generated region is only worth having if nobody can edit it and get
      # away with it. This regenerates every one of them from the tree at the
      # pin and fails on the diff.
      - name: Generated blueprint regions match the tables they come from
        run: python -m tools.bpc --check --strict

  tools:
    name: tools lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check tools tests

      - name: Ruff format
        run: ruff format --check tools tests

      - name: Tests
        run: pytest

  conformance:
    name: conformance suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The release the blueprints are written against, not whatever is newest.
      # A suite that passes on a different release has checked a different
      # runtime, and the runner prints both so a mismatch is visible.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          otp-version: "29.0.5"

      - name: Every case in every suite
        run: ./conformance/run.escript

  animations:
    name: animations still render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Manim draws text through Pango, draws everything else through Cairo, and
      # writes video through ffmpeg. Pycairo has no wheel here, so it compiles,
      # which is why the Cairo headers and pkg-config are in this list. Leaving
      # them out fails during pip install rather than during the render, with an
      # error about a missing `icc` that has nothing to do with the real cause.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcairo2-dev libpango1.0-dev ffmpeg

      - name: Install
        run: python -m pip install -e ".[anim]"

      # This renders and throws the result away. It does not compare the output
      # to the committed still, because two machines with different fonts draw
      # the same scene differently and the comparison would fail for a reason
      # nobody cares about. What it catches is a scene that stopped building at
      # all, which is what happens when the vocabulary changes under one.
      #
      # So a still can still go stale without CI noticing. Keeping it current is
      # on whoever edits the scene, and the reason to run this job anyway is
      # that a scene which no longer builds cannot be brought current at all.
      - name: Every scene builds and produces a still
        run: python -m tools.figures --still-only

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: python -m pip install yamllint==1.38.0 zizmor==1.30.0

      - name: Yamllint
        run: yamllint .github .yamllint.yml site/mkdocs.base.yml

      # zizmor knows about the failure modes that are specific to Actions, which
      # are template injection, a token with more scope than the job needs, and
      # an unpinned third party action. It is a pip package rather than an
      # action so that linting the supply chain does not add to it.
      - name: Zizmor
        run: zizmor --persona=regular .github/workflows

  site:
    name: site builds and the nav is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[site]"

      # The check runs before the stage so that a lesson added without its nav
      # entry fails here rather than becoming a page nobody can reach.
      - name: Navigation is up to date
        run: python -m tools.sitebuild --check

      - name: Stage
        run: python -m tools.sitebuild

      - name: Build
        run: mkdocs build --strict --config-file site/mkdocs.yml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: site
          path: site/_build
          retention-days: 7
