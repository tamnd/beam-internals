# OpenSSF Scorecard, which grades the repository on the things that actually go
# wrong in a supply chain. Pinned actions, branch protection, a security policy,
# whether a workflow token can write when it does not need to.
#
# This repository asks readers to run a virtual machine that speaks the Erlang
# distribution protocol, on their own machine, against sample code it ships. That
# is a lot of trust to ask for, so the answer to how it is checked should be a
# link to a score rather than a paragraph.

name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analyse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      # Into code scanning, so a regression shows up in the security tab next to
      # everything else rather than only in a badge.
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: results.sarif
