id = "t07"
title = "The reduction budget"
part = "01-tourist"
pass = "tourist"

# Tier 0 means a stock release install and nothing else. No emulator build, no
# root, no repository checkout. That claim is the reason this lesson was chosen
# as one of the three pilots, so it is written down here rather than implied.
env = "T0"
requires = ["otp-29", "livebook"]

duration_minutes = 25
deps = []
blueprint = "BP-SCHED-001"
boss = "boss.exs"

claims = [
  "CLM-SCHED-0001",
  "CLM-SCHED-0002",
  "CLM-SCHED-0003",
  "CLM-SCHED-0004",
  "CLM-SCHED-0005",
  "CLM-SCHED-0006",
  "CLM-SCHED-0007",
]

# The prediction gate. A reader who has not answered these has not done the
# lesson, and the grader for the last one is the lesson itself.
predictions = [
  "Four spinners on one core: together, or one after another?",
  "How many of something does a process get before it is swapped out?",
  "Does slow work get swapped out sooner than fast work?",
]

[bake]
# Cells whose output is identical on every machine, so CI can compare them.
deterministic = [
  "ask-the-vm",
  "measure",
  "per-call",
  "preemptions",
  "compiler-vote",
  "boss",
]

# Cells that are run to check they do not crash and whose output is not
# compared. Both of these were tried through the filters first and neither
# survives, for the same reason in two shapes.
#
# `fairness` prints four finishing times and the spread between them. Filtering
# the times erases the spread, and the spread is the answer: zero on one core is
# the whole point of the cell. Leaving the spread alone does not work either,
# because the spread on the all cores block is noise. The number to keep and the
# number to erase are the same number printed twice.
#
# `not-time` prints reduction counts, and they move by a few hundred between
# runs on one machine, so they are not deterministic and they are also exactly
# what the cell is about. A filter that erased them would erase the lesson.
not_compared = ["fairness", "not-time"]

# Cells whose output is the same everywhere once the noise is filtered out. The
# banner prints the emulator's build line, which carries this machine's
# scheduler counts and whichever optional features it was built with, and then
# prints the scheduler count again on a line of its own. Erase those two and
# what is left is the release, the erts version, the flavor and the word size,
# which is what the lesson is pinned to and worth comparing.
[bake.normalised]
banner = ["build-flags", "schedulers"]

[verified]
# Both architectures, both on the JIT, both on the pinned release. Verified by
# `just bake`, which pulls the cells out of the notebook and runs them the way
# Livebook runs them, rather than by somebody copying numbers off a screen.
"aarch64-darwin" = "OTP 29 erts-17.0.5"
"x86_64-linux" = "OTP 29 erts-17.0.5"
on = 2026-09-05
by = "tamnd"
how = "just bake t07"
