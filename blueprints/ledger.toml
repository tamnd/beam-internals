[[claim]]
id = "CLM-SCHED-0006"
text = "CONTEXT_REDS was 2000 until OTP 20.0. The commit that doubled it is the same commit that started charging a reduction on non-tail return, so the change was a change of unit and not a change of generosity."
where = ["t07"]
# Source reading, and the source is outside the pinned tree. The pin is one
# commit deep, so nothing in this repository can resolve a 2016 commit, and
# there is no way to observe a released VM from nine years ago from inside this
# one. o04 does the archaeology properly and this entry gets upgraded then.
evidence = "unobservable"
by = [
  "commit:6bcdd45abd97134fddfb5b0307b1d256337b0c67 in erlang/otp, Reduction counting on non-tail return, 2016-12-28",
]
verified = 2026-09-02
by_whom = "tamnd"

