[[claim]]
id = "CLM-SCHED-0003"
text = "One reduction is charged when a function is entered and one when a function returns, so a tail recursive loop costs one per iteration and a body recursive loop costs two."
where = ["t07", "BP-SCHED-001#3"]
evidence = "observed"
by = [
  "cell:t07/per-call",
  "erts/emulator/beam/jit/arm/instr_common.cpp:3114@OTP-29.0.5",
  "erts/emulator/beam/jit/arm/instr_call.cpp:51@OTP-29.0.5",
  "erts/emulator/beam/jit/x86/instr_common.cpp:3233@OTP-29.0.5",
  "erts/emulator/beam/jit/x86/instr_call.cpp:70@OTP-29.0.5",
]
verified = 2026-09-02
by_whom = "tamnd"

[[claim]]
id = "CLM-SCHED-0004"
text = "A process running a tail recursive loop is taken off its scheduler once every 4000 iterations, exactly, which ties the budget to the unit by measurement rather than by argument."
