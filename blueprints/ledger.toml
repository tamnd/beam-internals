# The claim ledger.
#
# Any sentence that asserts the BEAM does something is a claim, and every claim
# has an entry here naming what backs it. Structural statements count. Opinions
# do not, and are marked in the prose as the author's view.
#
# Evidence classes, strongest first:
#
#   observed           a cell in this repository demonstrates it and CI runs it
#   proved             Concuerror, PropEr, TLA+ or Coq establishes it
#   contractual        an upstream normative document says so, quoted and cited
#   demonstrated-only  a concurrency claim backed by runs rather than by search
#   unobservable       source reading, with no runtime evidence available
#
# The last two are capped per lesson at two and three. The caps are the point.
# They force the author to find an observation or to admit the gap.
#
# `verified` is when a person last checked the entry against the pinned tree. An
# entry older than the current pin is stale and cannot back a stable blueprint.

