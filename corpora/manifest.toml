# The two native code tapes, which are the other half of the pair above. The dis
# tapes are what the interpreter runs and these are what the JIT emitted for the
# same module of the same release, so the two can be put next to each other.
# There are two of them because the JIT emits a different instruction set on each
# machine, and the interesting part is that the difference is not only in the
# native code, it reaches back into which BEAM instructions the loader picked.
# Neither can be recorded on the machine the other one came from and neither can
# be recorded on the interpreter build at all.

