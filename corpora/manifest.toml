# The fourteen crash dump specimens. Eight of them died of different causes and
# six died the same way with the node in a different state, which is what shows
# which parts of a dump are about the cause of death and which parts are there
# every time. The recipe for each one lives in bxtrace/src/bxtrace_specimen.erl
# next to what the dump is expected to contain, and the recording fails rather
# than writing a tape if a specimen stops producing what it claims.
#
# What is kept is the tape, not the dump. A stock dump is about 1.8 MB and most
# of that is heap and atom text that means nothing away from the machine it came
# from. Fourteen of those would be thirty megabytes of near identical hex in a
