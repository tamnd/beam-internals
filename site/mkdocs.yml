# The parts of the site config a person writes. The navigation is generated from
# what is on disk by tools/sitebuild and written to mkdocs.yml, which is
# committed, so a lesson added without a page fails review instead of quietly
# becoming unreachable.

site_name: beam-internals
site_description: A visual teardown of the BEAM, the runtime behind Erlang and Elixir, pinned to OTP 29.0.5
site_url: https://beam-internals.dev
repo_url: https://github.com/tamnd/beam-internals
repo_name: tamnd/beam-internals
edit_uri: ""
copyright: Prose CC BY-SA 4.0, code Apache-2.0

docs_dir: docs
site_dir: _build

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Mermaid blocks are handed to the browser instead of being highlighted as
  # code. Livebook already renders them, so a diagram written once shows up as
  # a diagram in the notebook and on the site rather than as a wall of arrows.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  version:
    provider: mike
    default: "29"

nav:
  - Home: index.md
  - Layout: layout.md
  - Corpus: corpus.md
  - The Node sandbox: node.md
  - Contributing: contributing.md
  - Blueprint notation: notation.md
  - Lessons:
      - t01: lessons/t01/index.md
      - t02: lessons/t02/index.md
      - t07: lessons/t07/index.md
      - m02: lessons/m02/index.md
      - m55: lessons/m55/index.md
  - Blueprints:
      - BP-DIST-001: blueprints/BP-DIST-001.md
      - BP-SCHED-001: blueprints/BP-SCHED-001.md
      - BP-TERM-001: blueprints/BP-TERM-001.md
