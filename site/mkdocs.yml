# The parts of the site config a person writes. The navigation is generated from
# what is on disk by tools/sitebuild, and written to mkdocs.yml, which is not
# committed. That is what stops a lesson from being added and left with no page.

site_name: beam-internals
site_description: A visual teardown of the BEAM, the runtime behind Erlang and Elixir, pinned to OTP 29.0.5
site_url: https://beam-internals.dev
repo_url: https://github.com/tamnd/beam-internals
repo_name: tamnd/beam-internals
edit_uri: ""
copyright: Prose CC BY-SA 4.0, code Apache-2.0

docs_dir: docs
site_dir: _build

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search

extra:
  version:
    provider: mike
    default: "29"

nav:
  - Home: index.md
  - Layout: layout.md
  - Contributing: contributing.md
  - Blueprint notation: notation.md
