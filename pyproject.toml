# The checkers in tools/ are the only Python that ships. They are standard
# library only on purpose, so that a contributor can run every gate with the
# python that came with their machine and CI is not the first place a problem
# shows up. The dependencies below are for linting the checkers and for building
# the site, not for running them.

[project]
name = "beam-internals-tools"
version = "0.1.0"
description = "Prose, citation, ledger, blueprint and site checkers for beam-internals"
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "tamnd" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.5", "yamllint==1.38.0", "zizmor==1.30.0"]
site = ["mkdocs==1.6.1", "mkdocs-material==9.7.7", "mike==2.2.0"]
# Manim is the heaviest thing in the repository and nothing in `just check`
# needs it, so it stays out of dev. Install it when you are drawing.
anim = ["manim==0.19.0"]

[project.scripts]
lintprose = "tools.lintprose:main"
refcheck = "tools.refcheck:main"
ledger = "tools.ledger:main"
bplint = "tools.bplint:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tools"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
